<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Thiago Lorhan, Computer Engineering student</title>
  <desc id="desc">A dark retro terminal banner with a restrained animated cursor and a broad list of interests.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9a8edb" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0a17"/>
      <stop offset="1" stop-color="#17112b"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="360" rx="3"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#fade)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <path d="M0 312H1200" stroke="#8e79df" stroke-opacity=".2"/>
    <text x="42" y="55" fill="#b6a9ee" font-family="monospace" font-size="14" letter-spacing="1.6">THIAGOUH / UFPB</text>
    <text x="40" y="151" fill="#f1f2ff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="1">THIAGO</text>
    <text x="40" y="219" fill="#f1f2ff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="1">LORHAN</text>
    <text x="44" y="265" fill="#68e8e3" font-family="monospace" font-size="17" letter-spacing="1.1">COMPUTER ENGINEERING</text>
    <text x="44" y="298" fill="#9ca3b8" font-family="monospace" font-size="14" letter-spacing="1">UFPB / BRAZIL</text>

    <rect x="626" y="70" width="526" height="218" rx="5" fill="#0a0a14" fill-opacity=".84" stroke="#7866bb" stroke-opacity=".7"/>
    <path d="M626 107H1152" stroke="#7866bb" stroke-opacity=".48"/>
    <text x="648" y="95" fill="#b6a9ee" font-family="monospace" font-size="13" letter-spacing="1">INTERESTS.TXT</text>
    <text x="650" y="143" fill="#68e8e3" font-family="monospace" font-size="16">$ ls ~/interests/</text>
    <text x="674" y="178" fill="#e7e8f2" font-family="monospace" font-size="16">cybersecurity/</text>
    <text x="674" y="207" fill="#e7e8f2" font-family="monospace" font-size="16">games/</text>
    <text x="674" y="236" fill="#e7e8f2" font-family="monospace" font-size="16">systems/</text>
    <text x="674" y="265" fill="#e7e8f2" font-family="monospace" font-size="16">research/</text>
    <rect x="777" y="251" width="9" height="17" fill="#68e8e3">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <path d="M0 327H1200" stroke="#68e8e3" stroke-opacity=".35"/>
  </g>
</svg>
